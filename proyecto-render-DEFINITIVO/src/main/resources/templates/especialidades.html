<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Especialidades</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div class="container">
        <h2>Listado de Especialidades</h2>

        <!-- Formulario para agregar -->
        <form th:action="@{/especialidades/guardar}" th:object="${nuevaEspecialidad}" method="post">
            <input type="text" th:field="*{nombre}" placeholder="Nombre de la especialidad" required>
            <button type="submit">Agregar</button>
        </form>

        <!-- Tabla -->
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="esp : ${listaEspecialidades}">
                    <td th:text="${esp.idEspecialidad}"></td>
                    <td th:text="${esp.nombre}"></td>
                    <td>
                        <a th:href="@{'/especialidades/eliminar/' + ${esp.idEspecialidad}}"
                           onclick="return confirm('¿Eliminar esta especialidad?')">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listaEspecialidades)}">
                    <td colspan="3">No hay especialidades registradas.</td>
                </tr>
            </tbody>
        </table>

        <p><a th:href="@{/}">Volver al inicio</a></p>
    </div>
</body>
</html>
