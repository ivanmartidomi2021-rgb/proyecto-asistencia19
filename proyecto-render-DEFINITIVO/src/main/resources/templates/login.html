<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema Escolar</title>

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --gradient-accent: #f093fb;
            --bg-base: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --text-dark: #1a1a2e;
            --text-mid: #4a4a6a;
            --text-light: #8a8aaa;
            --border-light: rgba(255,255,255,0.12);
            --font: 'Outfit', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html, body { height: 100%; }

        body.login-page {
            font-family: var(--font);
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            color: white;
        }

        /* 🌌 Fondo animado con orbes */
        body.login-page::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(240, 147, 251, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(118, 75, 162, 0.3) 0%, transparent 55%);
            animation: floatBg 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes floatBg {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            50%  { transform: translate(2%, -2%) rotate(3deg) scale(1.08); }
            100% { transform: translate(-2%, 2%) rotate(-3deg) scale(1.05); }
        }

        /* ✨ Estrellas */
        body.login-page::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 90% 60%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 33% 80%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,0.6), transparent);
            background-size: 550px 550px;
            animation: twinkle 8s ease-in-out infinite;
            opacity: 0.6;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* 💎 Caja de Login (Glassmorphism) */
        .login-box {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ✨ Borde superior con degradado brillante */
        .login-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #f093fb, #764ba2, #667eea);
            background-size: 300% 100%;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* 🎯 Ícono central animado */
        .login-box::after {
            content: '🎓';
            position: absolute;
            top: -28px; left: 50%;
            transform: translateX(-50%);
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow:
                0 8px 24px rgba(102, 126, 234, 0.5),
                0 0 0 6px rgba(255, 255, 255, 0.08);
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%      { transform: translateX(-50%) translateY(-6px); }
        }

        /* 🏷️ Título */
        .login-box h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-top: 1.5rem;
            margin-bottom: 0.4rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #c4c4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-box h2::after {
            content: 'Bienvenido de nuevo al sistema';
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 8px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0;
        }

        /* 📝 Formulario */
        .login-box form {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            margin-top: 2rem;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0 16px;
            transition: var(--transition);
        }

        .input-box::before {
            font-family: "bootstrap-icons";
            position: absolute;
            left: 16px;
            font-size: 17px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: var(--transition);
        }

        .input-box:nth-of-type(1)::before { content: "\f4e1"; } /* person */
        .input-box:nth-of-type(2)::before { content: "\f47b"; } /* lock */

        .input-box:focus-within {
            border-color: rgba(102, 126, 234, 0.7);
            background: rgba(255, 255, 255, 0.1);
            box-shadow:
                0 0 0 4px rgba(102, 126, 234, 0.18),
                0 8px 24px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .input-box:focus-within::before {
            color: #a5b4fc;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 16px 0 16px 32px;
            font-family: var(--font);
            font-size: 15px;
            color: #fff;
            letter-spacing: 0.2px;
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-weight: 400;
        }

        /* 👁️ Botón mostrar contraseña */
        .toggle-password {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 17px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #a5b4fc;
            background: rgba(255, 255, 255, 0.08);
        }

        /* 🚀 Botón principal */
        .login-box button[type="submit"] {
            position: relative;
            margin-top: 0.5rem;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 14px;
            color: white;
            font-family: var(--font);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow:
                0 8px 24px rgba(102, 126, 234, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .login-box button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .login-box button[type="submit"]:hover {
            transform: translateY(-3px);
            background-position: 100% 50%;
            box-shadow:
                0 14px 32px rgba(102, 126, 234, 0.55),
                0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .login-box button[type="submit"]:hover::before {
            left: 100%;
        }

        .login-box button[type="submit"]:active {
            transform: translateY(-1px);
        }

        /* ⚠️ Mensaje de error */
        .error {
            margin-top: 1.2rem;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            color: #fca5a5;
            font-size: 13.5px;
            text-align: center;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: shake 0.5s ease;
        }

        .error::before {
            content: '\F33A';
            font-family: "bootstrap-icons";
            font-size: 16px;
            color: #ef4444;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* 📱 Responsive */
        @media (max-width: 480px) {
            .login-box {
                padding: 2.5rem 1.75rem;
                border-radius: 22px;
            }
            .login-box h2 { font-size: 24px; }
            .input-box input { font-size: 14.5px; padding: 15px 0 15px 30px; }
            .login-box button[type="submit"] { padding: 15px; font-size: 15px; }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-box">
        <h2>Iniciar Sesión</h2>

        <!-- El formulario DEBE enviarse por POST a /login -->
        <form th:action="@{/login}" method="post">
            
            <!-- 🛡️ TOKEN CSRF (Obligatorio para que Spring Security acepte el login) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="input-box">
                <input type="text" name="username" placeholder="Usuario" required autofocus autocomplete="username">
            </div>

            <div class="input-box">
                <input type="password" name="password" id="passwordInput" placeholder="Contraseña" required autocomplete="current-password">
                <button type="button" class="toggle-password" onclick="togglePassword()" title="Mostrar/Ocultar contraseña">
                    <i class="bi bi-eye-fill" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <!-- Mensaje de error de Spring Security -->
        <p class="error" th:if="${error}" th:text="${error}"></p>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');

            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash-fill';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye-fill';
            }
        }
    </script>
</body>
</html>
