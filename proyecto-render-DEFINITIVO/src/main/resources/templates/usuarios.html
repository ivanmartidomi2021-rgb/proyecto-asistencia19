<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios • Panel de Control</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Google Font: Inter para un look moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <style>
        /* Reset y configuración global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 0% 0%, #0f172a 0%, #020617 100%);
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Efecto de fondo con partículas sutiles */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(99, 102, 241, 0.03) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.03) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        /* Contenedor principal con efecto glassmorphism mejorado */
        .users-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 3rem 3.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), 
                        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        /* Encabezado con estadísticas */
        .header-stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.8rem;
            gap: 1.2rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .status-badge {
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.15);
            color: #6ee7b7;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        .status-badge i {
            font-size: 0.8rem;
        }

        .user-counter {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 0.35rem 1.4rem;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .user-counter span {
            color: #f1f5f9;
            font-weight: 700;
            font-size: 1.1rem;
        }

        h1 {
            font-weight: 800;
            font-size: 2.4rem;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        h1 i {
            color: #818cf8;
            font-size: 2.6rem;
            background: rgba(129, 140, 248, 0.08);
            padding: 10px;
            border-radius: 20px;
            border: 1px solid rgba(129, 140, 248, 0.06);
        }

        .btn-dashboard {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            font-weight: 500;
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .btn-dashboard:hover {
            background: rgba(129, 140, 248, 0.15);
            border-color: rgba(129, 140, 248, 0.25);
            color: #ffffff;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 30px rgba(129, 140, 248, 0.15);
        }

        .btn-dashboard i {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .btn-dashboard:hover i {
            transform: translateX(-4px);
        }

        /* Tabla de usuarios - diseño ultra moderno */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 0.5rem;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.02);
            padding: 2px;
        }

        .table-users {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .table-users thead th {
            background: transparent;
            color: #64748b;
            font-weight: 600;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 1rem 1.5rem;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .table-users tbody tr {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
            backdrop-filter: blur(4px);
            border: 1px solid transparent;
        }

        .table-users tbody tr:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(129, 140, 248, 0.12);
            transform: scale(1.005) translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .table-users tbody td {
            padding: 1.2rem 1.5rem;
            border: none;
            color: #f1f5f9;
            font-weight: 500;
            vertical-align: middle;
            background: transparent;
        }

        .table-users tbody td:first-child {
            border-top-left-radius: 24px;
            border-bottom-left-radius: 24px;
            padding-left: 2rem;
        }

        .table-users tbody td:last-child {
            border-top-right-radius: 24px;
            border-bottom-right-radius: 24px;
            padding-right: 2rem;
        }

        /* Estilo para el ID de usuario */
        .user-id {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(129, 140, 248, 0.08);
            padding: 0.25rem 1.2rem 0.25rem 0.8rem;
            border-radius: 60px;
            border: 1px solid rgba(129, 140, 248, 0.08);
            font-weight: 600;
            font-size: 0.85rem;
            color: #a5b4fc;
        }

        .user-id i {
            font-size: 0.9rem;
            color: #818cf8;
        }

        /* Celda de nombre de usuario con avatar */
        .user-cell {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.15), rgba(139, 92, 246, 0.08));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #818cf8;
            border: 1px solid rgba(129, 140, 248, 0.1);
            transition: all 0.3s ease;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .table-users tbody tr:hover .user-avatar {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.25), rgba(139, 92, 246, 0.15));
            transform: scale(1.05) rotate(-2deg);
            border-color: rgba(129, 140, 248, 0.2);
        }

        .user-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: #f8fafc;
            letter-spacing: -0.01em;
        }

        .user-email-hint {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 400;
            margin-left: 4px;
            display: none;
        }

        /* Badge de estado para usuarios (opcional) */
        .user-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.25rem 1rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .user-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Mensaje vacío */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #64748b;
        }

        .empty-state i {
            font-size: 3.5rem;
            color: #818cf8;
            opacity: 0.2;
            margin-bottom: 1.2rem;
            display: block;
        }

        .empty-state span {
            font-size: 1rem;
            font-weight: 400;
        }

        /* Footer */
        .table-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 1.5rem;
        }

        .footer-info {
            color: #475569;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.04em;
        }

        .footer-info i {
            color: #818cf8;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .users-container {
                padding: 1.8rem 1.2rem;
                border-radius: 32px;
            }

            h1 {
                font-size: 1.7rem;
            }

            h1 i {
                font-size: 1.8rem;
                padding: 6px;
            }

            .header-stats {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-dashboard {
                width: 100%;
                justify-content: center;
                padding: 0.6rem 1.2rem;
            }

            .table-users tbody td {
                padding: 1rem 0.8rem;
            }

            .table-users tbody td:first-child {
                padding-left: 1rem;
            }

            .table-users tbody td:last-child {
                padding-right: 1rem;
            }

            .user-avatar {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }

            .user-name {
                font-size: 0.95rem;
            }

            .user-id {
                font-size: 0.75rem;
                padding: 0.2rem 0.8rem 0.2rem 0.6rem;
            }
        }

        @media (max-width: 480px) {
            .users-container {
                padding: 1.2rem 0.8rem;
                border-radius: 24px;
            }

            .header-left {
                flex-wrap: wrap;
            }

            .user-counter {
                font-size: 0.75rem;
                padding: 0.2rem 1rem;
            }

            .table-users thead th {
                font-size: 0.55rem;
                padding: 0.8rem 0.6rem;
            }

            .table-users tbody td {
                padding: 0.8rem 0.5rem;
                font-size: 0.85rem;
            }
        }

        /* Scrollbar personalizado */
        .table-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .table-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: rgba(129, 140, 248, 0.2);
            border-radius: 20px;
        }
        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(129, 140, 248, 0.4);
        }
    </style>
</head>
<body>

<div class="users-container">
    
    <!-- Encabezado con estadísticas y navegación -->
    <div class="header-stats">
        <div class="header-left">
            <div class="status-badge">
                <i class="bi bi-shield-check"></i> Activos
            </div>
            <div class="user-counter">
                <i class="bi bi-people"></i>
                <span th:text="${#lists.size(listaUsuarios)}">0</span> usuarios
            </div>
        </div>
        <a href="/dashboard" class="btn-dashboard">
            <i class="bi bi-arrow-left-short"></i> Volver al Dashboard
        </a>
    </div>

    <!-- Título principal -->
    <h1>
        <i class="bi bi-person-arms-up"></i> 
        Panel de Usuarios
    </h1>

    <!-- Tabla de usuarios -->
    <div class="table-wrapper">
        <table class="table-users">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th style="text-align: right;">Estado</th>
                </tr>
            </thead>
            <tbody>
                <!-- Iteración con Thymeleaf -->
                <tr th:each="u : ${listaUsuarios}">
                    <td>
                        <span class="user-id">
                            <i class="bi bi-hash"></i>
                            <span th:text="${u.id_usuario}">001</span>
                        </span>
                    </td>
                    <td>
                        <div class="user-cell">
                            <div class="user-avatar" th:text="${#strings.substring(u.username, 0, 1)}">U</div>
                            <span class="user-name" th:text="${u.username}">UsuarioEjemplo</span>
                        </div>
                    </td>
                    <td style="text-align: right;">
                        <span class="user-status">
                            <span class="dot"></span>
                            Conectado
                        </span>
                    </td>
                </tr>
                <!-- Ejemplo estático (se reemplaza con Thymeleaf) -->
                <tr th:remove="all">
                    <td><span class="user-id"><i class="bi bi-hash"></i> 001</span></td>
                    <td>
                        <div class="user-cell">
                            <div class="user-avatar">A</div>
                            <span class="user-name">Ana García</span>
                        </div>
                    </td>
                    <td style="text-align: right;"><span class="user-status"><span class="dot"></span> Activo</span></td>
                </tr>
                <tr th:remove="all">
                    <td><span class="user-id"><i class="bi bi-hash"></i> 002</span></td>
                    <td>
                        <div class="user-cell">
                            <div class="user-avatar">J</div>
                            <span class="user-name">Juan Pérez</span>
                        </div>
                    </td>
                    <td style="text-align: right;"><span class="user-status"><span class="dot"></span> Activo</span></td>
                </tr>
            </tbody>
        </table>

        <!-- Mensaje si no hay usuarios -->
        <div th:if="${listaUsuarios == null or listaUsuarios.empty}" class="empty-state">
            <i class="bi bi-person-x"></i>
            <span>No hay usuarios registrados en el sistema.</span>
        </div>
    </div>

    <!-- Footer -->
    <div class="table-footer">
        <span class="footer-info">
            <i class="bi bi-database"></i>
            <span th:text="${#lists.size(listaUsuarios)}">0</span> registros · actualizado en tiempo real
        </span>
    </div>

</div>

<!-- Bootstrap JS (opcional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
