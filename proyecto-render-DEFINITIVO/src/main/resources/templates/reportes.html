<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Reportes | Sistema Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #2c5282;
            --primary-light: #3182ce;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1a202c;
            --text-muted: #718096;
            --border: #e2e8f0;
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 2rem; }
        
        .container { max-width: 1400px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .main-card { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); padding: 2rem; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .page-title { display: flex; align-items: center; gap: 1rem; }
        .page-title i { font-size: 2rem; color: var(--primary); }
        .page-title h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.5px; }
        .page-title p { font-size: 0.9rem; color: var(--text-muted); margin-top: 0.2rem; }

        .filtros-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; padding: 1.5rem; background: #f7fafc; border-radius: 12px; border: 1px solid var(--border); }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select { padding: 0.75rem; border: 1px solid #cbd5e0; border-radius: 8px; font-family: inherit; font-size: 0.95rem; color: var(--text-main); transition: all 0.2s; background: white; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { padding: 1.5rem; border-radius: 12px; background: white; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        .stat-card.success::before { background: #38a169; }
        .stat-card.danger::before { background: #e53e3e; }
        
        .stat-card .label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2.25rem; font-weight: 700; color: var(--text-main); line-height: 1; }
        .stat-card.success .value { color: #2f855a; }
        .stat-card.danger .value { color: #c53030; }

        .table-responsive { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); background: white; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead { background: #edf2f7; }
        th { padding: 1rem; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); }
        td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; color: var(--text-main); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f7fafc; }

        .badge { padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .badge-presente { background: #c6f6d5; color: #22543d; }
        .badge-ausente { background: #fed7d7; color: #742a2a; }

        .actions-bar { display: flex; gap: 1rem; justify-content: flex-end; padding-top: 1.5rem; border-top: 1px solid var(--border); }
        .btn { padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; font-family: inherit; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-pdf { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .btn-pdf:hover { background: #fed7d7; }
        .btn-excel { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
        .btn-excel:hover { background: #c6f6d5; }
        
        .loader { display: none; text-align: center; padding: 2rem; color: var(--primary); }
        .loader i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="main-card">
        
        <div class="page-header">
            <div class="page-title">
                <i class="bi bi-file-earmark-bar-graph-fill"></i>
                <div>
                    <h1>Centro de Reportes</h1>
                    <p>Genere, visualice y exporte reportes de asistencia institucional</p>
                </div>
            </div>
            <a th:href="@{/dashboard}" class="btn" style="background:#edf2f7; color:#4a5568;">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </a>
        </div>

        <div class="filtros-container">
            <div class="form-group">
                <label>Fecha de Inicio</label>
                <input type="date" id="filtroInicio" th:value="${inicio}">
            </div>
            <div class="form-group">
                <label>Fecha de Fin</label>
                <input type="date" id="filtroFin" th:value="${fin}">
            </div>
            <div class="form-group">
                <label>Estudiante</label>
                <select id="filtroAlumno">
                    <option value="">Todos los estudiantes</option>
                    <option th:each="alumno : ${listaAlumnos}" th:value="${alumno.idAlumno}" th:text="${alumno.nombres + ' ' + alumno.apellidos}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Estado de Asistencia</label>
                <select id="filtroEstado">
                    <option value="">Todos los estados</option>
                    <option value="Presente">Presente</option>
                    <option value="Ausente">Ausente</option>
                </select>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Registros Totales</div>
                <div class="value" id="statTotal">0</div>
            </div>
            <div class="stat-card success">
                <div class="label">Asistencias (Presentes)</div>
                <div class="value" id="statPresentes">0</div>
            </div>
            <div class="stat-card danger">
                <div class="label">Inasistencias (Ausentes)</div>
                <div class="value" id="statAusentes">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Índice de Asistencia</div>
                <div class="value" id="statPorcentaje">0%</div>
            </div>
        </div>

        <div class="loader" id="loader"><i class="bi bi-arrow-repeat"></i> Actualizando datos...</div>

        <div class="table-responsive" id="tablaContainer">
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">Fecha</th>
                        <th style="width: 40%;">Estudiante</th>
                        <th style="width: 15%;">Estado</th>
                        <th style="width: 30%;">Observaciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <!-- Los datos se cargan con JS -->
                </tbody>
            </table>
        </div>

        <div class="actions-bar">
            <a id="btnPdf" href="#" class="btn btn-pdf">
                <i class="bi bi-file-earmark-pdf-fill"></i> Exportar a PDF
            </a>
            <a id="btnExcel" href="#" class="btn btn-excel">
                <i class="bi bi-file-earmark-excel-fill"></i> Exportar a Excel
            </a>
        </div>

    </div>
</div>

<script>
    const inputInicio = document.getElementById('filtroInicio');
    const inputFin = document.getElementById('filtroFin');
    const selectAlumno = document.getElementById('filtroAlumno');
    const selectEstado = document.getElementById('filtroEstado');
    const tablaBody = document.getElementById('tablaBody');
    const loader = document.getElementById('loader');
    const tablaContainer = document.getElementById('tablaContainer');
    const btnPdf = document.getElementById('btnPdf');
    const btnExcel = document.getElementById('btnExcel');

    function actualizarReporte() {
        const inicio = inputInicio.value;
        const fin = inputFin.value;
        const idAlumno = selectAlumno.value;
        const estado = selectEstado.value;

        if (!inicio || !fin) return;

        loader.style.display = 'block';
        tablaContainer.style.opacity = '0.5';

        const queryString = `inicio=${inicio}&fin=${fin}${idAlumno ? '&idAlumno=' + idAlumno : ''}${estado ? '&estado=' + estado : ''}`;
        btnPdf.href = `/reportes/pdf?${queryString}`;
        btnExcel.href = `/reportes/excel?${queryString}`;

        fetch(`/reportes/datos?${queryString}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('statTotal').textContent = data.total;
                document.getElementById('statPresentes').textContent = data.presentes;
                document.getElementById('statAusentes').textContent = data.ausentes;
                document.getElementById('statPorcentaje').textContent = data.porcentaje + '%';

                tablaBody.innerHTML = '';
                if (data.asistencias.length === 0) {
                    tablaBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:3rem; color:#a0aec0;">No se encontraron registros para los filtros seleccionados.</td></tr>`;
                } else {
                    data.asistencias.forEach(a => {
                        const badgeClass = a.estado === 'Presente' ? 'badge-presente' : 'badge-ausente';
                        tablaBody.innerHTML += `
                            <tr>
                                <td>${a.fecha}</td>
                                <td style="font-weight:500;">${a.alumno}</td>
                                <td><span class="badge ${badgeClass}">${a.estado}</span></td>
                                <td style="color:#718096;">${a.bitacora || '-'}</td>
                            </tr>
                        `;
                    });
                }

                loader.style.display = 'none';
                tablaContainer.style.opacity = '1';
            })
            .catch(error => {
                console.error('Error:', error);
                loader.style.display = 'none';
                tablaContainer.style.opacity = '1';
            });
    }

    inputInicio.addEventListener('change', actualizarReporte);
    inputFin.addEventListener('change', actualizarReporte);
    selectAlumno.addEventListener('change', actualizarReporte);
    selectEstado.addEventListener('change', actualizarReporte);

    document.addEventListener('DOMContentLoaded', actualizarReporte);
</script>
</body>
</html>
