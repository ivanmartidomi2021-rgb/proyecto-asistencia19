<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes | Sistema Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --bg-base: #f0f4ff;
            --bg-surface: rgba(255,255,255,0.95);
            --text-dark: #1a1a2e;
            --text-mid: #4a4a6a;
            --border-light: rgba(0,0,0,0.08);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.1);
            --r-lg: 24px;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-base);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 2rem;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 30%, rgba(102,126,234,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(118,75,162,0.06) 0%, transparent 50%);
            z-index: -1;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .main-card {
            background: var(--bg-surface);
            border-radius: var(--r-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .main-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }
        .header-title {
            display: flex; align-items: center; gap: .75rem;
            margin-bottom: 1.5rem;
        }
        .header-title i {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-title h1 {
            font-size: 1.6rem; font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .filtros {
            display: flex; gap: 1rem; flex-wrap: wrap; align-items: end;
            padding: 1.25rem;
            background: linear-gradient(135deg, rgba(102,126,234,0.06), rgba(118,75,162,0.06));
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }
        .filtros .form-group { flex: 1; min-width: 180px; }
        .filtros label {
            font-size: .8rem; font-weight: 600; color: var(--text-mid);
            margin-bottom: .35rem; display: block;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .filtros input[type=date] {
            width: 100%; padding: .65rem .9rem;
            border: 1px solid var(--border-light);
            border-radius: 10px; font-family: inherit; font-size: .95rem;
            background: white;
        }
        .btn {
            padding: .7rem 1.4rem; border-radius: 10px; border: none;
            font-weight: 600; cursor: pointer; font-family: inherit;
            display: inline-flex; align-items: center; gap: .5rem;
            transition: all .25s ease; font-size: .95rem;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.4);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f56565, #c53030);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245,101,101,0.4);
            color: white;
        }
        .btn-secondary { background: #e2e8f0; color: var(--text-dark); }
        .btn-secondary:hover { background: #cbd5e0; color: var(--text-dark); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            padding: 1.25rem;
            border-radius: 16px;
            background: white;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all .25s ease;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .stat-card .label {
            font-size: .75rem; color: var(--text-mid);
            text-transform: uppercase; letter-spacing: .5px;
            margin-bottom: .4rem; font-weight: 600;
        }
        .stat-card .value {
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card.success .value {
            background: linear-gradient(135deg, #38a169, #2f855a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card.danger .value {
            background: linear-gradient(135deg, #e53e3e, #c53030);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .acciones {
            display: flex; gap: 1rem; flex-wrap: wrap;
            justify-content: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-light);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-card">
        <div class="header-title">
            <i class="bi bi-file-earmark-bar-graph-fill"></i>
            <h1>Reportes de Asistencia</h1>
        </div>

        <!-- Filtros -->
        <form method="get" th:action="@{/reportes}" class="filtros">
            <div class="form-group">
                <label>Fecha inicio</label>
                <input type="date" name="inicio" th:value="${inicio}" required>
            </div>
            <div class="form-group">
                <label>Fecha fin</label>
                <input type="date" name="fin" th:value="${fin}" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-search"></i> Consultar
            </button>
        </form>

        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total alumnos</div>
                <div class="value" th:text="${totalAlumnos}">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Registros</div>
                <div class="value" th:text="${totalRegistros}">0</div>
            </div>
            <div class="stat-card success">
                <div class="label">Presentes</div>
                <div class="value" th:text="${presentes}">0</div>
            </div>
            <div class="stat-card danger">
                <div class="label">Ausentes</div>
                <div class="value" th:text="${ausentes}">0</div>
            </div>
            <div class="stat-card">
                <div class="label">% Asistencia</div>
                <div class="value"><span th:text="${porcentaje}">0</span>%</div>
            </div>
        </div>

        <!-- Acciones -->
        <div class="acciones">
            <a th:href="@{/reportes/pdf(inicio=${inicio}, fin=${fin})}"
               class="btn btn-danger">
                <i class="bi bi-file-earmark-pdf-fill"></i> Descargar PDF
            </a>
            <a th:href="@{/asistencias}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver a Asistencias
            </a>
        </div>
    </div>
</div>
</body>
</html>
