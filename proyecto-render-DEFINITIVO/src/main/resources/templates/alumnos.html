<!-- 🔍 BARRA DE BÚSQUEDA Y ORDEN -->
<div class="search-bar">
    <form th:action="@{/alumnos}" method="get" class="search-form">
        <div class="search-input-group">
            <i class="bi bi-search"></i>
            <input type="text" name="buscar" placeholder="Buscar por nombre o apellido..."
                   th:value="${buscar}">
        </div>

        <div class="search-select-group">
            <i class="bi bi-sort-alpha-down"></i>
            <select name="orden">
                <option value="id" th:selected="${orden == 'id'}">Orden por defecto</option>
                <option value="nombre" th:selected="${orden == 'nombre'}">Nombre (A-Z)</option>
                <option value="apellido" th:selected="${orden == 'apellido'}">Apellido (A-Z)</option>
                <option value="grado" th:selected="${orden == 'grado'}">Grado</option>
            </select>
        </div>

        <button type="submit" class="btn-buscar">
            <i class="bi bi-search"></i> Buscar
        </button>

        <a th:href="@{/alumnos}" class="btn-limpiar" title="Limpiar filtros">
            <i class="bi bi-arrow-clockwise"></i>
        </a>
    </form>
</div>
