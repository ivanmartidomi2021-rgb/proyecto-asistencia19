<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulos Básicos</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font para un toque moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* Reset y fondo con gradiente */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
            padding: 2rem 1.5rem;
        }

        /* Tarjeta principal con efecto glassmorphism */
        .module-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Encabezado con badge y navegación */
        .header-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .module-badge {
            background: rgba(52, 211, 153, 0.18);
            color: #6ee7b7;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            padding: 0.45rem 1rem;
            border-radius: 60px;
            border: 1px solid rgba(52, 211, 153, 0.25);
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        .module-badge i {
            margin-right: 6px;
            font-size: 0.9rem;
        }

        h1 {
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 i {
            color: #34d399;
            font-size: 2.4rem;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #e2e8f0;
            font-weight: 500;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-ghost i {
            font-size: 1.2rem;
        }

        /* Tabla moderna y minimalista */
        .table-modern {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin: 0;
        }

        .table-modern thead th {
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.8rem 1.2rem;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .table-modern tbody tr {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            transition: all 0.2s ease;
            cursor: default;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .table-modern tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.01);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .table-modern tbody td {
            background: transparent;
            padding: 1.2rem 1.2rem;
            border: none;
            color: #f1f5f9;
            font-weight: 500;
            vertical-align: middle;
        }

        .table-modern tbody td:first-child {
            border-top-left-radius: 18px;
            border-bottom-left-radius: 18px;
            padding-left: 1.8rem;
        }

        .table-modern tbody td:last-child {
            border-top-right-radius: 18px;
            border-bottom-right-radius: 18px;
            padding-right: 1.8rem;
        }

        /* Estilo especial para el ID */
        .id-badge {
            display: inline-block;
            background: rgba(52, 211, 153, 0.12);
            color: #6ee7b7;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            border: 1px solid rgba(52, 211, 153, 0.15);
            backdrop-filter: blur(4px);
            letter-spacing: 0.02em;
        }

        /* Celda de nombre con icono */
        .module-name {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .module-name i {
            font-size: 1.6rem;
            color: #34d399;
            background: rgba(52, 211, 153, 0.08);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(52, 211, 153, 0.08);
            transition: 0.2s ease;
        }

        .table-modern tbody tr:hover .module-name i {
            background: rgba(52, 211, 153, 0.18);
            transform: rotate(4deg) scale(1.05);
        }

        .module-name span {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: -0.01em;
        }

        /* Estado vacío (si no hay materias) */
        .empty-message {
            text-align: center;
            padding: 2.5rem 0;
            color: #94a3b8;
            font-weight: 400;
        }

        .empty-message i {
            font-size: 2.8rem;
            color: #34d399;
            opacity: 0.4;
            margin-bottom: 0.8rem;
            display: block;
        }

        /* responsive */
        @media (max-width: 640px) {
            .module-card {
                padding: 1.8rem 1.2rem;
                border-radius: 32px;
            }

            h1 {
                font-size: 1.6rem;
            }

            h1 i {
                font-size: 1.8rem;
            }

            .header-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-ghost {
                width: 100%;
                justify-content: center;
            }

            .table-modern tbody td {
                padding: 1rem 0.8rem;
            }

            .table-modern tbody td:first-child {
                padding-left: 1rem;
            }

            .table-modern tbody td:last-child {
                padding-right: 1rem;
            }

            .module-name span {
                font-size: 1rem;
            }
        }

        /* scroll suave */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(52, 211, 153, 0.3);
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #34d399;
        }
    </style>
</head>
<body>

<div class="module-card">

    <!-- Encabezado con navegación y badge -->
    <div class="header-section">
        <div class="header-left">
            <div class="module-badge">
                <i class="bi bi-grid-3x3-gap-fill"></i> Módulos básicos
            </div>
        </div>
        <a href="/dashboard" class="btn-ghost">
            <i class="bi bi-arrow-left-short"></i> Volver al Dashboard
        </a>
    </div>

    <!-- Título principal -->
    <h1>
        <i class="bi bi-stack"></i> Materias Base
    </h1>

    <!-- Tabla con efecto vidrio y diseño renovado -->
    <div style="overflow-x: auto; margin-top: 1.5rem;">
        <table class="table-modern">
            <thead>
                <tr>
                    <th># Módulo</th>
                    <th>Materia</th>
                </tr>
            </thead>
            <tbody>
                <!-- Iteración con Thymeleaf -->
                <tr th:each="m : ${listaMaterias}">
                    <td>
                        <span class="id-badge" th:text="${m.idMateria}">01</span>
                    </td>
                    <td>
                        <div class="module-name">
                            <i class="bi bi-bookmark-check-fill"></i>
                            <span th:text="${m.nombre}">Fundamentos</span>
                        </div>
                    </td>
                </tr>
                <!-- Fila de ejemplo estática (se reemplaza con Thymeleaf) -->
                <tr th:remove="all">
                    <td><span class="id-badge">01</span></td>
                    <td>
                        <div class="module-name">
                            <i class="bi bi-bookmark-check-fill"></i>
                            <span>Introducción a la programación</span>
                        </div>
                    </td>
                </tr>
                <tr th:remove="all">
                    <td><span class="id-badge">02</span></td>
                    <td>
                        <div class="module-name">
                            <i class="bi bi-bookmark-check-fill"></i>
                            <span>Matemáticas discretas</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Mensaje en caso de lista vacía (opcional) -->
        <div th:if="${listaMaterias == null or listaMaterias.empty}" class="empty-message">
            <i class="bi bi-inbox"></i>
            <span>No hay materias disponibles en este módulo.</span>
        </div>
    </div>

    <!-- Pie sutil -->
    <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.03); padding-top: 1.2rem; display: flex; justify-content: flex-end;">
        <span style="color: #475569; font-size: 0.7rem; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px;">
            <i class="bi bi-dot" style="color: #34d399; font-size: 1.2rem;"></i> módulos activos
        </span>
    </div>

</div>

<!-- Bootstrap JS (opcional para interacciones) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
